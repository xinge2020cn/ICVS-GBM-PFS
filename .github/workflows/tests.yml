name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[deployment,test]"
      - run: ruff check src tests deployment
      - run: pytest
      - run: python -m json.tool configs/manifest.schema.json > /dev/null
      - run: python -m json.tool deployment/feature_schema.json > /dev/null
      - run: if command -v Rscript >/dev/null; then Rscript -e "invisible(parse(file='R/biological_analysis.R'))"; fi
      - run: python -m pip check
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: icvs-gbm-pfs --help
