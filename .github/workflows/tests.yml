name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[deployment,test]"
      - run: ruff check src tests deployment
      - run: pytest
      - run: python -m json.tool configs/manifest.schema.json > /dev/null
      - run: python -m json.tool deployment/feature_schema.json > /dev/null
      - run: python -m pip check
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: icvs-gbm-pfs --help

  r-syntax:
    name: R syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript -e "invisible(parse(file='R/biological_analysis.R'))"

  radiomics-install:
    name: PyRadiomics 3.1.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[radiomics,test]"
      - run: pytest tests/test_radiomics.py
