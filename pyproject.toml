[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icvs-gbm-pfs"
version = "1.0.0"
description = "Reproducible MRI survival modeling and biological interpretation for glioblastoma"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Xin Ge", email = "238012762+xinge2020cn@users.noreply.github.com"},
]
keywords = ["glioblastoma", "MRI", "survival analysis", "radiomics", "deep learning"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "joblib>=1.4,<2",
  "lifelines>=0.30,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.9,<1.10",
  "scikit-survival>=0.28,<0.29",
  "scipy>=1.14,<2",
  "SimpleITK>=2.4,<3",
  "torch>=2.7,<3",
]

[project.urls]
Repository = "https://github.com/xinge2020cn/ICVS-GBM-PFS"
Issues = "https://github.com/xinge2020cn/ICVS-GBM-PFS/issues"

[project.optional-dependencies]
radiomics = ["pyradiomics>=3.1,<4"]
segmentation = ["nnunetv2>=2.4,<3"]
test = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[project.scripts]
icvs-gbm-pfs = "icvs_gbm_pfs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
